<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d0a"><link rel="manifest" href="./manifest.webmanifest">
<title>Meu Painel LP</title>
<style>
:root{--bg:#090d0a;--panel:#121a14;--panel2:#19231b;--line:#28352b;--green:#b5ff39;--muted:#9eaa9f;--white:#f4f7f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px Inter,system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--white);padding:11px 14px}button.primary{background:var(--green);color:#10160c;border:0;font-weight:800}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0d130f;color:var(--white)}label{display:block;color:var(--muted);font-size:12px;margin:9px 0 5px}.hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:14px;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.brand img{width:56px;height:56px;object-fit:contain}.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:18px}.side,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}.side button{width:100%;text-align:left;margin:3px 0}.side button.active{border-color:var(--green);color:var(--green)}h2{margin:0 0 14px;font-size:23px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{font-size:25px;font-weight:800;margin-top:8px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:680px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted)}.pill{color:var(--green);font-size:11px}.login{max-width:360px;margin:10vh auto;padding:26px;background:var(--panel);border:1px solid var(--line);border-radius:22px;text-align:center}.pin{font-size:26px;letter-spacing:10px;text-align:center}.navtitle{font-size:11px;color:var(--muted);margin:14px 8px 5px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:6px}.side button{white-space:nowrap;width:auto}.top{align-items:flex-start}.wrap{padding:12px}}
</style></head>
<body>
<div id="login" class="login">
<img src="./logo-leo-penha.png" style="width:110px;height:80px;object-fit:contain" alt="LP">
<h2>MEU PAINEL</h2><p class="muted">Digite seu PIN de acesso</p>
<input id="pin" class="pin" inputmode="numeric" maxlength="6" type="password" placeholder="••••••" autocomplete="off">
<div class="actions"><button class="primary" style="width:100%" onclick="login()">Entrar</button></div><p id="loginMsg" class="muted"></p>
</div>
<div id="app" class="wrap hidden">
<header class="top"><div class="brand"><img src="./logo-leo-penha.png"><div><h1>MEU PAINEL <span class="pill">LP</span></h1><small>Gestão pessoal, empresarial e esportiva</small></div></div><button onclick="logout()">Sair</button></header>
<div class="layout"><nav class="side" id="nav">
<button class="active" data-page="inicio">Visão geral</button><button data-page="financeiro">Financeiro geral</button>
<div class="navtitle">EMPRESAS</div><button data-page="Elite Fitness">Elite Fitness</button><button data-page="Consultoria">Consultoria</button><button data-page="Drako">Drako</button><button data-page="Flex Design">Flex Design</button><button data-page="Pulse">Pulse</button>
<div class="navtitle">PESSOAL</div><button data-page="Meu Shape">Meu Shape</button>
</nav><main id="content"></main></div>
</div>
<script>
const API_URL="COLE_A_URL_DA_FUNCTION_AQUI";
let token=sessionStorage.getItem("lp_token")||"", page="inicio", cache={};
async function api(action,data={}){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok)throw Error(j.error||"Falha na operação");return j}
async function login(){const pin=document.querySelector("#pin").value;const m=document.querySelector("#loginMsg");if(!/^\d{6}$/.test(pin)){m.textContent="Digite os seis números.";return}try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",pin})});const j=await r.json();if(!r.ok)throw Error(j.error||"PIN inválido");token=j.token;sessionStorage.setItem("lp_token",token);document.querySelector("#login").classList.add("hidden");document.querySelector("#app").classList.remove("hidden");render()}catch(e){m.textContent=e.message}}
function logout(){token="";sessionStorage.removeItem("lp_token");document.querySelector("#app").classList.add("hidden");document.querySelector("#login").classList.remove("hidden");document.querySelector("#pin").value=""}
document.querySelector("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(!b)return;page=b.dataset.page;document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x===b));render()});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
async function render(){const el=document.querySelector("#content");el.innerHTML='<div class="card">Carregando...</div>';try{
if(page==="inicio"){const r=await api("summary");el.innerHTML=`<h2>Visão geral</h2><div class="grid"><div class="card"><span class="muted">Receitas do mês</span><div class="stat">${money(r.income)}</div></div><div class="card"><span class="muted">Despesas do mês</span><div class="stat">${money(r.expense)}</div></div><div class="card"><span class="muted">Resultado</span><div class="stat">${money(r.income-r.expense)}</div></div></div><div class="card" style="margin-top:14px"><h3>Fontes de renda</h3>${r.units.map(x=>`<p>${esc(x.unit_name)} <b style="float:right">${money(x.total)}</b></p>`).join("")}</div>`;return}
if(page==="financeiro"){el.innerHTML=`<h2>Financeiro geral</h2><div class="card"><h3>Novo lançamento</h3>${transactionForm()}</div><div class="card" style="margin-top:14px"><h3>Comparativo por empresa</h3><div id="financeRows"></div></div>`;const r=await api("transactions");document.querySelector("#financeRows").innerHTML=table(["Data","Empresa","Tipo","Descrição","Valor"],r.rows.map(x=>[x.entry_date,x.unit_name,x.entry_type==="income"?"Receita":"Despesa",x.description,money(x.amount)]));return}
if(page==="Consultoria"){el.innerHTML=`<h2>Consultoria</h2><div class="card"><h3>Adicionar aluno</h3><div class="formgrid"><div><label>Nome</label><input id="s_name"></div><div><label>Valor cobrado (R$)</label><input id="s_fee" type="number" step=".01"></div></div><button class="primary" onclick="addStudent()">Adicionar aluno</button></div><div class="card" style="margin-top:14px"><h3>Alunos e acompanhamento</h3><div id="students"></div></div>`;const r=await api("students");document.querySelector("#students").innerHTML=table(["Aluno","Treino OK","Atualização treino","Dieta OK","Atualização dieta","Último pagamento","Valor"],r.rows.map(x=>[esc(x.name),x.training_ok?"☑":"☐",x.training_updated_at||"—",x.diet_ok?"☑":"☐",x.diet_updated_at||"—",x.last_payment_date||"—",money(x.fee_amount)]));return}
if(page==="Elite Fitness"||page==="Drako"){el.innerHTML=`<h2>${esc(page)}</h2><div class="card"><h3>${page==="Drako"?"Registrar venda":"Lançamento financeiro"}</h3>${transactionForm(page)}</div><p class="muted">Registre somente operações comerciais legalmente autorizadas.</p>`;return}
if(page==="Flex Design"){el.innerHTML=`<h2>Flex Design</h2><div class="card"><h3>Novo pedido</h3><div class="formgrid"><div><label>Atleta</label><input id="athlete"></div><div><label>Contato (Instagram/WhatsApp)</label><input id="contact"></div><div><label>Serviço</label><select id="service"><option>Arte</option><option>Carrossel</option><option>Pacote de artes</option></select></div><div><label>Quantidade</label><input id="qty" type="number" value="1"></div><div><label>Valor (R$)</label><input id="amount" type="number" step=".01"></div></div><button class="primary" onclick="addFlex()">Salvar pedido</button></div>`;return}
if(page==="Pulse"){el.innerHTML=`<h2>Pulse</h2><div class="grid"><div class="card"><h3>Projetos para executar</h3><label>Nome do projeto</label><input id="project"><button class="primary" onclick="addProject()">Adicionar projeto</button></div><div class="card"><h3>Trabalhos agendados</h3><label>Cliente</label><input id="client"><label>Trabalho</label><input id="job"><label>Data</label><input id="date" type="date"><label>Valor contratado</label><input id="contract" type="number"><label>Custos previstos</label><input id="cost" type="number"><button class="primary" onclick="addJob()">Salvar trabalho</button></div></div>`;return}
if(page==="Meu Shape"){el.innerHTML=`<h2>Meu Shape</h2><div class="grid"><div class="card"><h3>Treino</h3><label>Data</label><input id="tdate" type="date"><label>Grupo muscular</label><input id="muscle"><label>Exercício</label><input id="exercise"><label>Séries</label><input id="sets" type="number"><label>Repetições</label><input id="reps"><label>Carga (kg)</label><input id="load" type="number" step=".5"><button class="primary" onclick="addTraining()">Salvar treino</button></div><div class="card"><h3>Cardio</h3><label>Data</label><input id="cdate" type="date"><label>Modalidade</label><input id="modality"><label>Duração (min)</label><input id="duration" type="number"><label>Distância (km)</label><input id="distance" type="number" step=".1"><button class="primary" onclick="addCardio()">Salvar cardio</button></div><div class="card"><h3>Alimentação</h3><label>Data</label><input id="ndate" type="date"><label>Refeição / descrição</label><input id="meal"><label>Calorias</label><input id="cal" type="number"><label>Proteína (g)</label><input id="protein" type="number"><label>Carboidratos (g)</label><input id="carbs" type="number"><label>Gorduras (g)</label><input id="fat" type="number"><label>Peso (kg)</label><input id="weight" type="number" step=".1"><button class="primary" onclick="addNutrition()">Salvar alimentação</button></div></div>`;return}
}catch(e){el.innerHTML=`<div class="card"><h2>Não foi possível carregar</h2><p>${esc(e.message)}</p></div>`}}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function transactionForm(unit=""){return `<div class="formgrid"><div><label>Empresa</label><select id="unit">${["Elite Fitness","Consultoria","Drako","Flex Design","Pulse"].map(x=>`<option ${unit===x?"selected":""}>${x}</option>`).join("")}</select></div><div><label>Tipo</label><select id="type"><option value="income">Receita</option><option value="expense">Despesa</option></select></div><div><label>Data</label><input id="txdate" type="date"></div><div><label>Descrição</label><input id="desc"></div><div><label>Categoria</label><input id="category"></div><div><label>Forma de pagamento</label><input id="payment"></div><div><label>Valor (R$)</label><input id="value" type="number" step=".01"></div></div><button class="primary" onclick="addTransaction()">Salvar lançamento</button>`}
async function done(p){try{await api(p.action,p.data);alert("Salvo!");render()}catch(e){alert(e.message)}}
function val(id){return document.getElementById(id)?.value||""}
async function addTransaction(){await done({action:"save_transaction",data:{unit_name:val("unit"),entry_type:val("type"),entry_date:val("txdate"),description:val("desc"),category:val("category"),payment_method:val("payment"),amount:Number(val("value"))}})}
async function addStudent(){await done({action:"save_student",data:{name:val("s_name"),fee_amount:Number(val("s_fee"))}})}
async function addFlex(){await done({action:"save_flex",data:{athlete_name:val("athlete"),contact:val("contact"),service_type:val("service"),quantity:Number(val("qty")),amount:Number(val("amount"))}})}
async function addProject(){await done({action:"save_project",data:{title:val("project")}})}
async function addJob(){await done({action:"save_job",data:{client_name:val("client"),job_description:val("job"),scheduled_at:val("date"),contract_amount:Number(val("contract")),estimated_cost:Number(val("cost"))}})}
async function addTraining(){await done({action:"save_training",data:{performed_on:val("tdate"),muscle_group:val("muscle"),exercise:val("exercise"),sets:Number(val("sets")),reps:val("reps"),load_kg:Number(val("load"))}})}
async function addCardio(){await done({action:"save_cardio",data:{performed_on:val("cdate"),modality:val("modality"),duration_minutes:Number(val("duration")),distance_km:Number(val("distance"))}})}
async function addNutrition(){await done({action:"save_nutrition",data:{logged_on:val("ndate"),meal_name:val("meal"),calories:Number(val("cal")),protein_g:Number(val("protein")),carbs_g:Number(val("carbs")),fat_g:Number(val("fat")),body_weight_kg:Number(val("weight"))}})}
if(token){document.querySelector("#login").classList.add("hidden");document.querySelector("#app").classList.remove("hidden");}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
